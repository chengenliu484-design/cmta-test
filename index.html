    };

    // 1. 新增：專業的陣列洗牌演算法 (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            // 交換元素位置
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 2. 更新：開始測驗函數
    function startQuiz() {
        currentQuestionIndex = 0;
        scores = { H: 0, E: 0, C: 0, I: 0, R: 0, L: 0, T: 0, N: 0 };
        document.getElementById('title').style.display = 'none';

        // 在測驗開始前，將 60 題大題庫進行洗牌
        shuffleArray(questions);

        showQuestion();
    }

    // 3. 更新：顯示題目函數（包含選項洗牌與動態重新編號）
    function showQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('progress-text').innerText = `題目進度：${currentQuestionIndex + 1} / ${questions.length}`;
        
        // 處理題目文字：用正則表達式自動濾掉原本寫死的題號 (如 "1. ")
        let cleanQuestionText = q.text.replace(/^\d+\.\s*/, '');
        // 加上新的動態題號
        document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${cleanQuestionText}`;
        
        // 將該題的四個選項複製出來，並進行選項洗牌
        let shuffledOptions = [...q.options];
        shuffleArray(shuffledOptions);

        let optionsHtml = "";
        const labels = ['A', 'B', 'C', 'D']; // 用來重新賦予乾淨的選項標籤
        
        shuffledOptions.forEach((opt, index) => {
            // 處理選項文字：用正則表達式自動濾掉原本寫死的標籤 (如 "(A) ")
            let cleanOptionText = opt.text.replace(/^\([A-D]\)\s*/, '');
            
            // 生成按鈕：綁定原本的精準計分邏輯 (opt.add, opt.points)，但顯示新的 ABCD 順序
            optionsHtml += `<button class="option-btn" onclick="answerQuestion('${opt.add}', ${opt.points})">(${labels[index]}) ${cleanOptionText}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHtml;
    }

    function answerQuestion(axis, points) {
        // 給對應的代碼加分
        scores[axis] += points;
        
        // 前進到下一題
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            calculateResult();
        }
    }

    function calculateResult() {
        // 數學對決：哪邊分數大，就拿哪邊的字母
        let code = "";
        code += (scores.H >= scores.E) ? "H" : "E";
        code += (scores.C >= scores.I) ? "C" : "I";
        code += (scores.R >= scores.L) ? "R" : "L";
        code += (scores.T >= scores.N) ? "T" : "N";

        // 隱藏題目，顯示結果
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('result-code').innerText = code;
        document.getElementById('result-name').innerText = resultNames[code] || "【未知領域的開拓者】";
    }
